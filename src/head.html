<meta name="claude:viewport-fit-sides" content="cover">
<title>Private Markets Reporting Platform</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky header + tab strip; KPI row first, then paired chart cards, then tables. Cool slate neutrals with one blue accent. */
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface2:#f7f8fb; --ink:#101826; --ink2:#465263; --muted:#6f7a8b; --line:#e0e5ec; --grid:#e9edf2;
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --violet:#6250d6;
  --blue-tint:#9cc0ee; --accent:#2a78d6; --accent-ink:#ffffff;
  --good:#1a7f4b; --good-bg:#e4f4ec; --warn:#a86a00; --warn-bg:#fbefd5; --bad:#c0392b; --bad-bg:#fbe5e2;
  --shadow:0 1px 2px rgba(16,24,38,.05);
  --f-sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d1117; --surface:#151b24; --surface2:#1a212c; --ink:#e8edf4; --ink2:#a8b3c2; --muted:#7f8b9b; --line:#252d39; --grid:#202833;
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --violet:#9085e9; --blue-tint:#2b4a73; --accent:#3987e5; --accent-ink:#06121f;
  --good:#46b982; --good-bg:#12291f; --warn:#e2a93f; --warn-bg:#2e2410; --bad:#ef6f61; --bad-bg:#33181a; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1117; --surface:#151b24; --surface2:#1a212c; --ink:#e8edf4; --ink2:#a8b3c2; --muted:#7f8b9b; --line:#252d39; --grid:#202833;
  --blue:#3987e5; --orange:#d95926; --aqua:#199e70; --violet:#9085e9; --blue-tint:#2b4a73; --accent:#3987e5; --accent-ink:#06121f;
  --good:#46b982; --good-bg:#12291f; --warn:#e2a93f; --warn-bg:#2e2410; --bad:#ef6f61; --bad-bg:#33181a; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1240px;margin:0 auto}
header.top{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:20px 0 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:34px;height:34px;border-radius:6px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--f-mono);font-weight:500;font-size:13px;letter-spacing:.02em;flex:none}
h1{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em;line-height:1.2}
.sub{color:var(--muted);font-size:12px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--f-mono);font-size:11px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink2);background:var(--surface);white-space:nowrap}
.chip.sim{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-bg)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 20px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{padding:10px 14px;color:var(--ink2);text-decoration:none;font-weight:500;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px;font-size:13.5px}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
a:focus-visible,button:focus-visible,th[tabindex]:focus-visible,tr[tabindex]:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.toolbar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:hidden}
.seg button{font:inherit;font-size:13px;border:0;background:none;color:var(--ink2);padding:6px 13px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
select{font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
h2{font-size:15px;font-weight:600;margin:0 0 2px;letter-spacing:-.005em}
h3{font-size:12px;font-weight:500;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
p.lede{margin:0 0 6px;color:var(--ink2);max-width:75ch}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 14px 12px;box-shadow:var(--shadow);min-width:0}
.kpi .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
.kpi .v{font-family:var(--f-mono);font-size:24px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .d{font-size:12px;color:var(--ink2);margin-top:5px;font-family:var(--f-mono)}
.d .up{color:var(--good)} .d .dn{color:var(--bad)}
.grid{display:grid;gap:16px;margin-bottom:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card .note{font-size:12px;color:var(--muted);margin:4px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12px;color:var(--ink2);margin:8px 0 6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.chart{width:100%;position:relative}
.chart svg{display:block;max-width:100%;overflow:visible}
svg text{font-family:var(--f-sans);font-size:11px;fill:var(--muted)}
svg text.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
svg text.lbl{fill:var(--ink2)}
svg text.val{fill:var(--ink);font-family:var(--f-mono);font-size:11px}
.tablewrap{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;font-weight:500;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;cursor:pointer;user-select:none;background:var(--surface)}
th.r,td.r{text-align:right}
th:hover{color:var(--ink)}
th .ar{display:inline-block;width:10px;color:var(--accent)}
td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td.wrap{white-space:normal;min-width:200px}
tbody tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface2)}
tbody tr.sel td{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.good{color:var(--good);background:var(--good-bg)} .pill.warn{color:var(--warn);background:var(--warn-bg)} .pill.bad{color:var(--bad);background:var(--bad-bg)} .pill.neutral{color:var(--ink2);background:var(--surface2);border:1px solid var(--line)}
.tag{font-family:var(--f-mono);font-size:11px;padding:1px 6px;border-radius:4px;background:var(--surface2);border:1px solid var(--line);color:var(--ink2)}
.commentary{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.commentary li{padding-left:14px;position:relative;color:var(--ink2);max-width:90ch}
.commentary li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:6px;border-radius:1px;background:var(--accent)}
.commentary b{color:var(--ink);font-weight:600}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 10px;border-radius:8px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:260px}
#tip .t{font-weight:600;margin-bottom:4px}
#tip .row{display:flex;justify-content:space-between;gap:16px;font-family:var(--f-mono);font-size:11.5px}
#tip .row i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:step}
.flow>div{border:1px solid var(--line);border-radius:10px;padding:12px 12px 12px;background:var(--surface2);position:relative;min-width:0}
.flow b{display:block;font-size:13px;margin-bottom:4px}
.flow span{font-size:12px;color:var(--ink2);display:block}
.flow em{font-style:normal;font-family:var(--f-mono);font-size:10.5px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
dl.defs{display:grid;grid-template-columns:minmax(100px,170px) 1fr;gap:10px 18px;margin:0}
dl.defs dt{font-weight:600} dl.defs dd{margin:0;color:var(--ink2)}
dl.defs code,.code{font-family:var(--f-mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
.bar-score{display:flex;align-items:center;gap:10px}
.bar-score .track{flex:1;height:6px;background:var(--grid);border-radius:3px;overflow:hidden;min-width:60px}
.bar-score .fill{height:100%;background:var(--accent);border-radius:3px}
.tl{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tl li{display:grid;grid-template-columns:90px 1fr auto;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);align-items:start}
.tl li:last-child{border-bottom:0}
.tl .w{font-family:var(--f-mono);font-size:12px;color:var(--muted);padding-top:2px}
.tl b{display:block}.tl span.d{color:var(--ink2);font-size:13px}
footer{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;max-width:100ch}
.empty{color:var(--muted)}
@media (max-width:640px){.kpi .v{font-size:20px}.tl li{grid-template-columns:1fr;gap:4px}dl.defs{grid-template-columns:1fr;gap:2px}dl.defs dd{margin-bottom:10px}h1{font-size:16px}}
@media (prefers-reduced-motion:no-preference){.view{animation:fade .25s ease-out}@keyframes fade{from{opacity:.4}to{opacity:1}}}
</style>
